<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#111111">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>قائمة المدبلجين العرب - AR anime</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../icon-192.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        :root{
            --he-bg:#07080c; --he-surface:#12141c; --he-surface-2:#181a24; --he-border:#262838;
            --he-red:#e50914; --he-red-2:#ff3b3b; --he-gold:#ffb800; --he-muted:#93939f;
        }
        @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }
        body{ font-family:'Cairo', sans-serif; background:var(--he-bg); color:#fff; margin:0; }

        .he-page-hero{ position:relative; text-align:center; padding:80px 20px 50px; overflow:hidden; isolation:isolate; }
        .he-page-hero::before{
            content:""; position:absolute; inset:0; z-index:-1;
            background:radial-gradient(ellipse 55% 60% at 50% 0%, rgba(229,9,20,0.22), transparent 70%);
        }
        .he-page-icon{
            width:64px; height:64px; border-radius:16px; margin:0 auto 18px; display:flex; align-items:center; justify-content:center;
            font-size:1.7rem; color:#fff; background:linear-gradient(135deg, var(--he-red-2), var(--he-red));
            box-shadow:0 14px 30px -8px rgba(229,9,20,0.6);
        }
        .he-page-hero h1{ font-weight:900; font-size:clamp(1.7rem,3.6vw,2.4rem); margin:0 0 10px; }
        .he-page-hero p{ color:var(--he-muted); font-size:0.95rem; max-width:520px; margin:0 auto; }

        .dubbers-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:20px; max-width:1200px; margin:0 auto; padding:10px 20px 60px 20px; }
        .dubber-card{
            position:relative; background:var(--he-surface); border:1px solid var(--he-border); border-radius:14px;
            padding:26px 20px; text-align:center; cursor:pointer; transition:transform 0.3s ease, border-color 0.3s ease;
            opacity:0; transform:translateY(18px); animation:heFadeIn .6s ease forwards;
        }
        @keyframes heFadeIn{ to{ opacity:1; transform:translateY(0); } }
        .dubber-card:hover{ transform:translateY(-7px); border-color:rgba(229,9,20,0.55); box-shadow:0 16px 30px -12px rgba(0,0,0,0.6); }
        .dubber-avatar{
            width:78px; height:78px; border-radius:50%; object-fit:cover; margin:0 auto 14px;
            border:2px solid var(--he-border); transition:border-color .3s ease;
        }
        .dubber-card:hover .dubber-avatar{ border-color:var(--he-red-2); }
        .dubber-avatar-fallback{
            width:78px; height:78px; border-radius:50%; margin:0 auto 14px; display:flex; align-items:center; justify-content:center;
            background:linear-gradient(135deg, var(--he-surface-2), var(--he-border)); color:var(--he-muted); font-size:1.5rem;
        }
        .dubber-card h3{ color:#fff; font-size:1.1rem; margin-bottom:6px; }
        .dubber-card p{ color:var(--he-muted); font-size:0.85rem; margin:0; }
        .dubber-cta{ display:inline-block; margin-top:15px; color:var(--he-red-2); font-size:0.85rem; font-weight:bold; }

        footer{ text-align:center; padding:34px 20px; color:var(--he-muted); font-size:0.85rem; border-top:1px solid var(--he-border); }
        footer a{ color:var(--he-muted); text-decoration:none; }
        footer a:hover{ color:var(--he-red-2); }
    </style>
    <link rel="stylesheet" href="../css/finish.css">
    <link rel="stylesheet" href="../css/mobile.css">
    <link rel="stylesheet" href="../css/modern.css">
</head>
<body>
       <header class="main-header">
        <div class="logo">
            <div class="logo rgb-text">AR anime</div>    
        </div>
        <button type="button" class="menu-icon" aria-label="فتح القائمة" aria-controls="navMenu" aria-expanded="false"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
        <nav id="navMenu">
            <div class="close-btn">&times;</div>
            <a href="../index.html"><span class="rgb-text">الرئيسية</span></a>
            <a href="browse.html"><span class="rgb-text">الأنميات</span></a>
            <a href="teams.html"><span class="rgb-text">الفرق</span></a>
            <a href="dubbers.html"><span class="rgb-text">المدبلجون</span></a>
            <a href="women.html"><span class="rgb-text">الفتيات</span></a>
            <a href="men.html"><span class="rgb-text">الشباب</span></a>
            <a href="account.html"><span class="rgb-text">حسابي</span></a>
        </nav>
    </header>

    <div class="he-page-hero">
        <div class="he-page-icon"><i class="fa-solid fa-microphone-lines"></i></div>
        <h1>فريق الدبلجة والمؤدون الصوتيون</h1>
        <p>اختر أي مؤدي لاستعراض سجله والأعمال التي شارك فيها</p>
        <p style="margin-top:14px;"><a href="account.html" style="display:inline-block;padding:10px 22px;border-radius:10px;background:linear-gradient(135deg,#ff2b36,#e50914);color:#fff;font-weight:900;text-decoration:none;">انضم كمدبلج مع فريقك</a></p>
    </div>

    <div class="be-dubber-toolbar"><label class="be-dubber-search"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input id="dubber-search" type="search" placeholder="ابحث بالاسم أو الدور..." autocomplete="off"></label><span id="dubber-result-count" class="be-dubber-result-count" aria-live="polite"></span></div>
    <div id="dubbers-container" class="dubbers-grid"></div>

    <footer>
        <a href="legal.html">سياسة الخصوصية</a> | <a href="tel:+905014770828">تواصل معنا</a>
        <p>&copy; 2026 أكاديمية AR anime.</p>
    </footer>

    <script src="../data/supabase_config.js"></script>
    <script src="../data/db_loader.js"></script>
    <script src="../data/supabase_config.js"></script>
    <script src="../data/people_loader.js"></script>
    <script src="../data/actors_engine.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const container = document.getElementById("dubbers-container");
            const search = document.getElementById("dubber-search");
            const resultCount = document.getElementById("dubber-result-count");
            const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#39;"}[c]));
            try { await DB.installSlim(); } catch (error) { console.warn("تعذر تحميل بعض تفاصيل الدبلجة", error); }
            container.replaceChildren();
            if (typeof dubbersDatabase === 'undefined') {
                const message = document.createElement('p'); message.className = 'be-no-dubbers'; message.textContent = 'تعذّر تحميل قائمة المدبلجين حالياً.'; container.appendChild(message); return;
            }
            let i = 0;
            for (const [actorId, data] of Object.entries(dubbersDatabase)) {
                const aggregate = window.ActorsEngine?.getActorAggregate(actorId) || null;
                const profile = window.ActorsEngine?.getActorProfile(actorId) || {name:data.name||actorId,role:data.role||'مؤدي أصوات',description:data.bio||'',tier:'عضو'};
                const card = document.createElement("div"); card.className = "dubber-card"; card.tabIndex = 0; card.setAttribute("role", "link");
                card.setAttribute("aria-label", "عرض ملف " + profile.name);
                card.dataset.search = `${profile.name} ${profile.role} ${profile.description}`.toLocaleLowerCase("ar");
                card.style.animationDelay = `${(i++ % 12) * 45}ms`;
                const avatarHtml = data.logo && /^https:\/\//i.test(data.logo)
                    ? `<img loading="lazy" class="dubber-avatar" src="${escapeHtml(data.logo)}" alt="صورة ${escapeHtml(profile.name)}">`
                    : `<div class="dubber-avatar-fallback" aria-hidden="true"><i class="fa-solid fa-user"></i></div>`;
                const countLine = aggregate ? `<span class="dubber-count">${aggregate.workCount} عمل • ${aggregate.characterCount} شخصية</span>` : '';
                card.innerHTML = `${avatarHtml}<h3>${escapeHtml(profile.name)}</h3><p>${escapeHtml(profile.role)}</p><div class="dubber-description">${escapeHtml(profile.description)}</div><span class="dubber-tier"><i class="fa-solid fa-award" aria-hidden="true"></i> ${escapeHtml(profile.tier)}</span>${countLine}<span class="dubber-cta">عرض الشخصيات والبورتفوليو ←</span>`;
                const avatar = card.querySelector(".dubber-avatar");
                if (avatar) avatar.addEventListener("error", () => { const fallback = document.createElement("div"); fallback.className = "dubber-avatar-fallback"; fallback.setAttribute("aria-hidden", "true"); fallback.textContent = profile.name.slice(0, 1); avatar.replaceWith(fallback); }, {once:true});
                const openProfile = () => { window.location.href = `actor.html?id=${encodeURIComponent(actorId)}`; };
                card.addEventListener('click', openProfile); card.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openProfile(); } });
                container.appendChild(card);
            }
            const empty = document.createElement('p'); empty.className = 'be-no-dubbers'; empty.textContent = 'ما لقينا نتائج مطابقة. جرّب كلمة ثانية.';
            const updateDubberResults = () => {
                const q = search.value.trim().toLocaleLowerCase('ar'); let visible = 0;
                container.querySelectorAll('.dubber-card').forEach(card => { const match = !q || card.dataset.search.includes(q); card.hidden = !match; if (match) visible++; });
                resultCount.textContent = `${visible} مدبلج${q ? ' ضمن نتائج البحث' : ''}`;
                if (!visible) { if (!empty.isConnected) container.appendChild(empty); } else empty.remove();
            };
            search.addEventListener('input', updateDubberResults); updateDubberResults();
        });
    </script>
    <script src="../data/site.js"></script>
</body>
</html>
