<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google-site-verification" content="V5K4gME715mhjvvhA7y2I6dHxR_x2pxBjrQPpJE_d04" />
    <meta name="theme-color" content="#111111">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../icon-192.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../css/style.css">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('../sw.js').catch(err => console.log('SW Error:', err));
        });
      }
    </script>

    <title>تفاصيل الفريق - Black Echo</title>
    <style>
        :root{
            --he-bg:#07080c; --he-surface:#12141c; --he-surface-2:#181a24; --he-border:#262838;
            --he-red:var(--accent-red, #e50914); --he-red-2:#ff3b3b; --he-gold:#ffb800; --he-muted:#93939f;
        }
        @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }
        body{ font-family:'Cairo', sans-serif; background:var(--he-bg); color:#fff; margin:0; }

        .banner{ width:100%; height:380px; background-size:cover; background-position:center; position:relative; display:flex; align-items:flex-end; }
        .banner-overlay{ position:absolute; inset:0; background:linear-gradient(to top, var(--he-bg) 8%, rgba(7,8,12,0.35) 55%, rgba(7,8,12,0.15) 100%); }
        .banner-content{ position:relative; z-index:2; padding:45px; max-width:800px; }
        .banner-content span.eyebrow{ display:inline-block; color:var(--he-red-2); font-weight:700; font-size:0.8rem; letter-spacing:1px; margin-bottom:10px; }
        .banner-content h1{ margin:0 0 12px 0; font-size:clamp(1.9rem,4.4vw,2.8rem); font-weight:900; text-shadow:2px 2px 8px #000; }
        .banner-content p{ margin:0; color:#ddd; font-size:1rem; line-height:1.8; max-width:600px; text-shadow:1px 1px 3px #000; }

        .container{ max-width:1200px; margin:0 auto; padding:55px 20px; }
        .section-title{ font-size:1.4rem; font-weight:900; border-right:4px solid var(--he-red-2); padding-right:15px; margin-bottom:26px; }
        .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:20px; margin-bottom:60px; }

        .member-card{
            background:var(--he-surface); border:1px solid var(--he-border); border-radius:14px; padding:24px 18px; text-align:center;
            cursor:pointer; transition:0.3s; opacity:0; transform:translateY(18px); animation:heFadeIn .6s ease forwards;
        }
        @keyframes heFadeIn{ to{ opacity:1; transform:translateY(0); } }
        .member-card:hover{ border-color:var(--he-red-2); transform:translateY(-7px); box-shadow:0 16px 30px -12px rgba(0,0,0,0.5); }
        .member-card img{ width:78px; height:78px; border-radius:50%; margin-bottom:14px; object-fit:cover; border:2px solid var(--he-border); }
        .member-card:hover img{ border-color:var(--he-red-2); }
        .member-card h4{ margin:0 0 5px 0; font-size:1.05rem; }
        .member-card span{ color:var(--he-muted); font-size:0.82rem; }

        .anime-card{
            background:var(--he-surface); border-radius:14px; overflow:hidden; border:1px solid var(--he-border);
            cursor:pointer; transition:0.3s; opacity:0; transform:translateY(18px); animation:heFadeIn .6s ease forwards;
        }
        .anime-card:hover{ transform:translateY(-7px); border-color:var(--he-red-2); box-shadow:0 16px 30px -12px rgba(0,0,0,0.5); }
        .anime-card .img-wrap{ width:100%; aspect-ratio:2/3; overflow:hidden; }
        .anime-card img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s ease; }
        .anime-card:hover img{ transform:scale(1.08); }
        .anime-card h4{ margin:0; padding:14px; text-align:center; font-size:0.95rem; }

        footer{ text-align:center; padding:34px 20px; color:var(--he-muted); font-size:0.85rem; border-top:1px solid var(--he-border); }
        footer a{ color:var(--he-muted); text-decoration:none; }
        footer a:hover{ color:var(--he-red-2); }
    </style>
</head>
<body>
   <header class="main-header">
        <div class="logo">
            <div class="logo rgb-text">AR Anime</div>    
        </div>
        <div class="menu-icon">☰</div>
        <nav id="navMenu">
            <div class="close-btn">&times;</div>
            <a href="../index.html"><span class="rgb-text">الرئيسية</span></a>
            <a href="browse.html"><span class="rgb-text">الدوبلاج</span></a>
            <a href="women.html"><span class="rgb-text">الفتيات</span></a>
            <a href="men.html"><span class="rgb-text">الشباب</span></a>
            <a href="competition.html"><span class="rgb-text">المسابقات</span></a>
            <a href="teams.html"><span class="rgb-text">قائمة المدبلجين</span></a>
        </nav>
    </header>
    <div id="team-banner" class="banner">
        <div class="banner-overlay"></div>
        <div class="banner-content">
            <span class="eyebrow">فريق دبلجة</span>
            <h1 id="team-name">جاري التحميل...</h1>
            <p id="team-desc"></p>
        </div>
    </div>

    <div class="container">
        <h2 class="section-title">أعضاء الفريق</h2>
        <div id="members-grid" class="grid"></div>

        <h2 class="section-title">إنتاجات الفريق</h2>
        <div id="anime-grid" class="grid"></div>
    </div>

    <footer>
        <a href="legal.html">سياسة الخصوصية</a> | <a href="tel:+905014770828">تواصل معنا</a>
        <p>&copy; 2026 أكاديمية Black Echo.</p>
    </footer>

    <script src="../data/anime_db.js"></script>
    <script src="../data/teams.js"></script>
    <script src="../data/teams_engine.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const menuIcon = document.querySelector('.menu-icon');
            const navMenu = document.getElementById('navMenu');
            const closeBtn = document.querySelector('.close-btn');
            if(menuIcon && navMenu) menuIcon.addEventListener('click', () => navMenu.classList.add('active'));
            if(closeBtn && navMenu) closeBtn.addEventListener('click', () => navMenu.classList.remove('active'));

            const urlParams = new URLSearchParams(window.location.search);
            const teamId = urlParams.get("id");
            const team = teamsDatabase[teamId];

            if (!team) {
                document.body.innerHTML = "<h2 style='text-align:center; padding:50px; color:#fff; font-family:Cairo,sans-serif;'>الفريق غير موجود</h2>";
                return;
            }

            document.getElementById("team-banner").style.backgroundImage = `url('${team.banner}')`;
            document.getElementById("team-name").innerText = team.name;
            document.getElementById("team-desc").innerText = team.description;

            const membersGrid = document.getElementById("members-grid");
            team.members.forEach((member, i) => {
                const card = document.createElement("div");
                card.className = "member-card";
                card.style.animationDelay = `${i * 45}ms`;
                card.innerHTML = `
                    <img src="${member.avatar}" alt="${member.name}">
                    <h4>${member.name}</h4>
                    <span>${member.role}</span>
                `;
                card.onclick = () => window.location.href = `actor.html?id=${encodeURIComponent(member.id)}`;
                membersGrid.appendChild(card);
            });

            const animeGrid = document.getElementById("anime-grid");
            // producedAnime هنا = القائمة اليدوية (لو موجودة) + أي أنميات جديدة
            // في anime_db.js اللي dubbingTeam بتاعها اتربط تلقائياً بهذا الفريق
            const aggregate = (typeof window.TeamsEngine !== "undefined")
                ? window.TeamsEngine.getTeamAggregate(teamId)
                : { producedAnime: team.producedAnime || [] };

            aggregate.producedAnime.forEach((anime, i) => {
                const card = document.createElement("div");
                card.className = "anime-card";
                card.style.animationDelay = `${i * 60}ms`;
                const imgHtml = anime.poster
                    ? `<img src="${anime.poster}" alt="${anime.title}">`
                    : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--he-surface-2,#181a24);"><i class="fa-solid fa-clapperboard" style="font-size:2rem;color:var(--he-muted,#93939f);"></i></div>`;
                card.innerHTML = `
                    <div class="img-wrap">${imgHtml}</div>
                    <h4>${anime.title}</h4>
                `;
                card.onclick = () => window.location.href = `anime.html?id=${encodeURIComponent(anime.id)}`;
                animeGrid.appendChild(card);
            });
        });
    </script>
</body>
</html>
