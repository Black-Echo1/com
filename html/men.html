    <style>
        :root{
            --he-bg:#07080c; --he-surface:#12141c; --he-surface-2:#181a24; --he-border:#262838;
            --he-red:var(--accent-red, #e50914); --he-red-2:#ff3b3b; --he-gold:#ffb800;
            --he-cat:#3d7bff; --he-text:#f2f2f5; --he-muted:#93939f;
        }
        @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; scroll-behavior:auto !important; } }
        body{ background:var(--he-bg); }

        .he-page-hero{
            position:relative; text-align:center; padding:80px 20px 50px; overflow:hidden; isolation:isolate;
        }
        .he-page-hero::before{
            content:""; position:absolute; inset:0; z-index:-1;
            background:radial-gradient(ellipse 55% 60% at 50% 0%, color-mix(in srgb, var(--he-cat) 22%, transparent), transparent 70%);
        }
        .he-page-icon{
            width:64px; height:64px; border-radius:16px; margin:0 auto 18px; display:flex; align-items:center; justify-content:center;
            font-size:1.7rem; color:#fff; background:color-mix(in srgb, var(--he-cat) 85%, #000 10%);
            box-shadow:0 14px 30px -8px color-mix(in srgb, var(--he-cat) 65%, transparent);
        }
        .he-page-hero h2{ font-family:'Cairo',sans-serif; font-weight:900; font-size:clamp(1.7rem,3.6vw,2.5rem); color:#fff; margin:0 0 10px; }
        .he-page-hero p{ color:var(--he-muted); font-size:0.95rem; max-width:520px; margin:0 auto; }

        .he-section{ max-width:1240px; margin:0 auto; padding:10px 20px 70px; }
        .he-reveal{ opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s ease; }
        .he-reveal.is-visible{ opacity:1; transform:translateY(0); }

        .video-grid{ display:grid !important; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)) !important; gap:22px !important; }
        .video-card{
            background:var(--he-surface); border:1px solid var(--he-border); border-radius:14px; overflow:hidden;
            transition:transform .3s ease, border-color .3s ease; padding-bottom:16px;
        }
        .video-card:hover{ transform:translateY(-6px); border-color:color-mix(in srgb, var(--he-cat) 55%, var(--he-border)); }
        .smart-thumbnail{ position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; cursor:pointer; }
        .smart-thumbnail img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s ease; }
        .video-card:hover .smart-thumbnail img{ transform:scale(1.08); }
        .play-overlay{
            position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
            background:linear-gradient(to top, rgba(7,8,12,0.85), rgba(7,8,12,0.15) 60%);
            color:#fff; font-weight:700; font-family:'Cairo',sans-serif; font-size:0.85rem;
            opacity:0; transition:opacity .3s ease;
        }
        .video-card:hover .play-overlay{ opacity:1; }
        .video-card h3{ color:#fff; font-size:0.95rem; font-weight:700; margin:14px 16px 12px; font-family:'Cairo',sans-serif; }
        .download-buttons-holder{ display:flex; gap:10px; padding:0 16px; flex-wrap:wrap; }
        .download-btn{
            flex:1; text-align:center; padding:9px 10px; border-radius:8px; font-size:0.78rem; font-weight:700;
            text-decoration:none; font-family:'Cairo',sans-serif; transition:transform .2s ease, opacity .2s ease;
        }
        .download-btn.btn-subs{ background:linear-gradient(135deg, var(--he-red-2), var(--he-red)); color:#fff; }
        .download-btn.btn-no-subs{ background:rgba(255,255,255,0.06); color:var(--he-text); border:1px solid var(--he-border); }
        .download-btn:hover{ transform:translateY(-2px); opacity:0.92; }

        .modal{ position:fixed; inset:0; background:rgba(5,5,8,0.9); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:200; padding:20px; }
        .modal-content{ position:relative; width:100%; max-width:900px; background:var(--he-surface); border:1px solid var(--he-border); border-radius:16px; padding:20px; text-align:center; }
        .video-modal-content{ text-align:initial; }
        .close-video{ position:absolute; top:-14px; left:-14px; background:var(--he-red-2); color:#fff; border:none; padding:8px 14px; border-radius:20px; cursor:pointer; font-weight:bold; z-index:5; font-family:'Cairo',sans-serif; font-size:0.8rem; }
        .video-wrapper{ position:relative; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:10px; margin-top:10px; }
        .video-wrapper iframe{ position:absolute; top:0; left:0; width:100%; height:100%; border:none; }
        .server-tabs-container{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
        .server-btn{ background:rgba(255,255,255,0.06); color:#fff; border:1px solid var(--he-border); padding:7px 16px; border-radius:8px; cursor:pointer; font-family:'Cairo',sans-serif; font-size:0.8rem; transition:.2s; }
        .server-btn.active, .server-btn:hover{ background:linear-gradient(135deg, var(--he-red-2), var(--he-red)); border-color:transparent; }
        .ad-placeholder{ background:rgba(255,255,255,0.05); border:1px dashed var(--he-border); border-radius:10px; padding:40px; color:var(--he-muted); font-family:'Cairo',sans-serif; margin-bottom:16px; }
        .close-ad{ background:linear-gradient(135deg, var(--he-red-2), var(--he-red)); color:#fff; border:none; padding:10px 24px; border-radius:8px; cursor:pointer; font-weight:700; font-family:'Cairo',sans-serif; }

        footer{ text-align:center; padding:34px 20px; color:var(--he-muted); font-size:0.85rem; border-top:1px solid var(--he-border); margin-top:20px; font-family:'Cairo',sans-serif; }
        footer a{ color:var(--he-muted); text-decoration:none; }
        footer a:hover{ color:var(--he-red-2); }
    </style>
</head>
<body class="animated-bg">
   <header class="main-header">
        <div class="logo">
            <div class="logo rgb-text">AR Anime</div>    
        </div>
        <div class="menu-icon">☰</div>
        <nav id="navMenu">
            <div class="close-btn">&times;</div>
            <a href="../index.html"><span class="rgb-text">الرئيسية</span></a>

            <a href="teams.html"><span class="rgb-text">قائمة المدبلجين</span></a>

    <div class="he-page-hero he-reveal">
        <div class="he-page-icon"><i class="fa-solid fa-mars"></i></div>
        <h2>مكتبة تدريب <span class="rgb-text">الشباب</span></h2>

    </div>

    <div class="he-section">

    <div id="adModal" class="modal">

    </footer>
    <script src="../data/data.js"></script>
    <script src="../data/script.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuIcon = document.querySelector('.menu-icon');
            const navMenu = document.getElementById('navMenu');
            const closeBtn = document.querySelector('.close-btn');
            if(menuIcon && navMenu) menuIcon.addEventListener('click', () => navMenu.classList.add('active'));
            if(closeBtn && navMenu) closeBtn.addEventListener('click', () => navMenu.classList.remove('active'));

            const revealEls = document.querySelectorAll('.he-reveal');
            if ('IntersectionObserver' in window) {
                const io = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) { entry.target.classList.add('is-visible'); io.unobserve(entry.target); }
                    });
                }, { threshold: 0.05 });
                revealEls.forEach(el => io.observe(el));
            } else {
                revealEls.forEach(el => el.classList.add('is-visible'));
            }
        });
    </script>
</body>
