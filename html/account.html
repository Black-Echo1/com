<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <title>حسابي وطلب الانضمام - Black Echo</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../icon-192.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body{ font-family:'Cairo',sans-serif; background:#0b0b0f; color:#fff; margin:0; }
        .acc-wrap{ max-width:520px; margin:0 auto; padding:90px 18px 60px; }
        .acc-card{ background:#15151b; border:1px solid #2a2a33; border-radius:16px; padding:26px 22px; }
        .acc-card h1{ font-size:1.4rem; margin:0 0 6px; font-weight:900; }
        .acc-card p.sub{ color:#a0a0ad; font-size:.9rem; margin:0 0 18px; line-height:1.7; }
        .acc-tabs{ display:flex; gap:8px; margin-bottom:18px; }
        .acc-tabs button{ flex:1; padding:10px; border-radius:10px; border:1px solid #2a2a33; background:#0f0f14; color:#a0a0ad; font:inherit; font-weight:700; cursor:pointer; }
        .acc-tabs button.on{ background:linear-gradient(135deg,#ff2b36,#e50914); color:#fff; border-color:transparent; }
        label{ display:block; font-size:.85rem; color:#c9c9d3; margin:14px 0 6px; font-weight:700; }
        input,select,textarea{ width:100%; box-sizing:border-box; padding:11px 12px; border-radius:10px; border:1px solid #2a2a33; background:#0f0f14; color:#fff; font:inherit; }
        textarea{ min-height:90px; resize:vertical; }
        input:focus,select:focus,textarea:focus{ outline:none; border-color:#e50914; }
        .btn{ width:100%; margin-top:20px; padding:12px; border:0; border-radius:10px; background:linear-gradient(135deg,#ff2b36,#e50914); color:#fff; font:inherit; font-weight:900; cursor:pointer; }
        .btn:disabled{ opacity:.55; cursor:wait; }
        .btn.ghost{ background:#0f0f14; border:1px solid #2a2a33; color:#c9c9d3; margin-top:12px; }
        .msg{ margin-top:14px; font-size:.88rem; line-height:1.7; min-height:1.2em; }
        .msg.err{ color:#ff6b6b; } .msg.ok{ color:#4ade80; }
        .status{ border-radius:12px; padding:14px 16px; line-height:1.8; font-size:.92rem; margin-bottom:6px; }
        .status.pending{ background:#2a2410; border:1px solid #5c4d12; color:#ffd666; }
        .status.approved{ background:#102a18; border:1px solid #1d5a30; color:#4ade80; }
        .status.rejected{ background:#2a1010; border:1px solid #5a1d1d; color:#ff8a8a; }
        .hint{ font-size:.78rem; color:#7d7d8a; margin-top:5px; }
        [hidden]{ display:none !important; }
    </style>
</head>
<body class="animated-bg">
    <header class="main-header">
        <div class="logo"><div class="logo rgb-text">AR Anime</div></div>
        <button type="button" class="menu-icon" aria-label="فتح القائمة" aria-controls="navMenu" aria-expanded="false"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
        <nav id="navMenu">
            <div class="close-btn">&times;</div>
            <a href="../index.html"><span class="rgb-text">الرئيسية</span></a>
            <a href="browse.html"><span class="rgb-text">الدوبلاج</span></a>
            <a href="dubbers.html"><span class="rgb-text">المدبلجون</span></a>
            <a href="teams.html"><span class="rgb-text">الفرق</span></a>
        </nav>
    </header>

    <main class="acc-wrap">
        <!-- 1) غير مسجّل -->
        <section class="acc-card" id="auth-box" hidden>
            <h1>تسجيل الدخول</h1>
            <p class="sub">سجّل دخولك أو أنشئ حساباً، وبعدها تقدر تقدّم طلب انضمام كمدبلج مع فريقك. ما ينضاف أحد للموقع إلا بعد موافقة الإدارة.</p>
            <div class="acc-tabs">
                <button type="button" id="tab-login" class="on">دخول</button>
                <button type="button" id="tab-signup">حساب جديد</button>
            </div>
            <label for="email">الإيميل</label>
            <input id="email" type="email" autocomplete="email" dir="ltr">
            <label for="password">كلمة السر</label>
            <input id="password" type="password" autocomplete="current-password" dir="ltr">
            <div class="hint" id="pw-hint" hidden>6 أحرف على الأقل.</div>
            <button type="button" class="btn" id="auth-submit">دخول</button>
            <div class="msg" id="auth-msg" role="status"></div>
        </section>

        <!-- 2) مسجّل -->
        <section class="acc-card" id="member-box" hidden>
            <h1>طلب الانضمام كمدبلج</h1>
            <p class="sub" id="who"></p>
            <div id="status-box"></div>

            <div id="claims-box"></div>
            <form id="apply-form" onsubmit="return false;" hidden>
                <label for="f-name">اسمك الذي يظهر في الموقع</label>
                <input id="f-name" maxlength="60" autocomplete="off">
                <label for="f-team">فريقك</label>
                <select id="f-team"></select>
                <label for="f-role">دورك</label>
                <select id="f-role">
                    <option>مؤدي أصوات</option><option>مهندس صوت</option><option>مخرج دبلجة</option><option>مترجم</option><option>كاتب نصوص</option>
                </select>
                <label for="f-bio">نبذة عنك (اختياري)</label>
                <textarea id="f-bio" maxlength="600"></textarea>
                <label for="f-social">رابط حسابك (اختياري)</label>
                <input id="f-social" type="url" dir="ltr" placeholder="https://...">
                <label for="f-avatar">رابط صورتك (اختياري)</label>
                <input id="f-avatar" type="url" dir="ltr" placeholder="https://...">
                <div class="hint">الروابط لازم تبدأ بـ https://</div>
                <button type="button" class="btn" id="apply-submit">إرسال الطلب</button>
                <div class="msg" id="apply-msg" role="status"></div>
            </form>
            <button type="button" class="btn ghost" id="logout">تسجيل الخروج</button>
        </section>

        <div class="msg err" id="fatal" hidden></div>
    </main>

    <footer style="text-align:center;padding:30px 20px;color:#7d7d8a;font-size:.85rem;border-top:1px solid #2a2a33;">
        <a href="legal.html" style="color:inherit;text-decoration:none;">سياسة الخصوصية</a>
        <p>&copy; 2026 أكاديمية Black Echo.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="../data/supabase_config.js"></script>
    <script>
    (function () {
        'use strict';
        var $ = function (id) { return document.getElementById(id); };
        var cfg = window.SUPABASE_CONFIG || {};
        function show(el, on) { el.hidden = !on; }
        function say(el, text, cls) { el.textContent = text; el.className = 'msg' + (cls ? ' ' + cls : ''); }

        if (!cfg.url || !cfg.anonKey || !window.supabase) {
            var f = $('fatal'); f.hidden = false;
            f.textContent = 'خدمة الحسابات غير مفعّلة بعد (تأكد من ضبط supabase_config.js).';
            return;
        }
        var client = window.supabase.createClient(cfg.url, cfg.anonKey);
        var mode = 'login';

        function setMode(m) {
            mode = m;
            $('tab-login').className = m === 'login' ? 'on' : '';
            $('tab-signup').className = m === 'signup' ? 'on' : '';
            $('auth-submit').textContent = m === 'login' ? 'دخول' : 'إنشاء حساب';
            $('password').autocomplete = m === 'login' ? 'current-password' : 'new-password';
            show($('pw-hint'), m === 'signup');
            say($('auth-msg'), '');
        }
        $('tab-login').onclick = function () { setMode('login'); };
        $('tab-signup').onclick = function () { setMode('signup'); };

        $('auth-submit').onclick = async function () {
            var email = $('email').value.trim(), password = $('password').value;
            if (!email || password.length < 6) { say($('auth-msg'), 'اكتب إيميلك وكلمة سر (6 أحرف على الأقل).', 'err'); return; }
            var btn = $('auth-submit'); btn.disabled = true; say($('auth-msg'), '');
            try {
                if (mode === 'login') {
                    var r = await client.auth.signInWithPassword({ email: email, password: password });
                    if (r.error) throw r.error;
                } else {
                    var s = await client.auth.signUp({ email: email, password: password });
                    if (s.error) throw s.error;
                    if (!s.data.session) { say($('auth-msg'), 'أرسلنا لك رابط تأكيد على إيميلك. افتحه ثم ارجع وسجّل دخولك.', 'ok'); btn.disabled = false; return; }
                }
                await render();
            } catch (e) {
                var m = String(e && e.message || e);
                if (/Invalid login/i.test(m)) m = 'الإيميل أو كلمة السر غير صحيحة.';
                else if (/already registered/i.test(m)) m = 'هذا الإيميل مسجّل من قبل، جرّب الدخول.';
                else if (/confirm/i.test(m)) m = 'لازم تأكد إيميلك أول (شيّك صندوق الوارد).';
                else if (/rate limit/i.test(m)) m = 'محاولات كثيرة، انتظر شوي وجرّب.';
                say($('auth-msg'), m, 'err');
            }
            btn.disabled = false;
        };

        $('logout').onclick = async function () { await client.auth.signOut(); await render(); };

        var teamsLoaded = false;
        async function loadTeams() {
            if (teamsLoaded) return;
            var r = await client.from('teams').select('id,name').order('sort_order');
            var sel = $('f-team'); sel.innerHTML = '';
            (r.data || []).forEach(function (t) { var o = document.createElement('option'); o.value = t.id; o.textContent = t.name; sel.appendChild(o); });
            teamsLoaded = true;
        }

        function statusBox(req) {
            var box = $('status-box'); box.innerHTML = '';
            if (!req) return;
            var d = document.createElement('div');
            if (req.status === 'pending') { d.className = 'status pending'; d.textContent = 'طلبك قيد المراجعة. بنخبرك بقبوله، وتقدر ترجع هنا وتشوف حالته.'; }
            else if (req.status === 'approved') { d.className = 'status approved'; d.textContent = 'تم قبولك! صرت ظاهر في صفحة المدبلجين وفي فريقك.'; }
            else { d.className = 'status rejected'; d.textContent = 'تم رفض طلبك' + (req.admin_note ? ': ' + req.admin_note : '.') + ' تقدر تعدّل بياناتك وتقدّم من جديد.'; }
            box.appendChild(d);
        }

        async function render() {
            var sess = (await client.auth.getSession()).data.session;
            show($('auth-box'), !sess); show($('member-box'), !!sess);
            if (!sess) return;
            $('who').textContent = 'مسجّل بإيميل: ' + sess.user.email;
            var r = await client.from('join_requests').select('status,admin_note,created_at').order('created_at', { ascending: false }).limit(1);
            var req = r.data && r.data[0];
            var nx = new URLSearchParams(location.search).get('next');
            if (nx && /^[\w.\-\/?=&%]+$/.test(nx) && nx.indexOf('//') === -1 && nx.indexOf(':') === -1) { location.href = nx; return; }
            statusBox(req);
            var canApply = !req || req.status === 'rejected';
            show($('apply-form'), canApply);
            if (canApply) await loadTeams();
            await renderClaims();
        }

        async function renderClaims() {
            var box = $('claims-box'); box.innerHTML = '';
            var r = await client.from('role_claims').select('anime_id,character_name,status,admin_note').order('created_at', { ascending: false }).limit(30);
            if (r.error || !r.data || !r.data.length) return;
            var h = document.createElement('h2'); h.textContent = 'طلبات الشخصيات'; h.style.cssText = 'font-size:1.05rem;margin:22px 0 10px;';
            box.appendChild(h);
            var names = { pending: 'قيد المراجعة', approved: 'مؤكَّدة', rejected: 'مرفوضة' };
            r.data.forEach(function (c) {
                var d = document.createElement('div'); d.className = 'status ' + c.status; d.style.margin = '8px 0';
                d.textContent = c.character_name + ' (' + c.anime_id + ') — ' + names[c.status] + (c.admin_note ? ': ' + c.admin_note : '');
                box.appendChild(d);
            });
        }

        $('apply-submit').onclick = async function () {
            var name = $('f-name').value.trim(), team = $('f-team').value;
            var social = $('f-social').value.trim(), avatar = $('f-avatar').value.trim();
            var https = /^https:\/\/[^\s<>"']+$/i;
            if (name.length < 2) { say($('apply-msg'), 'اكتب اسمك (حرفين على الأقل).', 'err'); return; }
            if (!team) { say($('apply-msg'), 'اختر فريقك.', 'err'); return; }
            if ((social && !https.test(social)) || (avatar && !https.test(avatar))) { say($('apply-msg'), 'الروابط لازم تبدأ بـ https://', 'err'); return; }
            var sess = (await client.auth.getSession()).data.session;
            if (!sess) { await render(); return; }
            var btn = $('apply-submit'); btn.disabled = true; say($('apply-msg'), '');
            var ins = await client.from('join_requests').insert({
                user_id: sess.user.id, display_name: name, team_id: team, role: $('f-role').value,
                bio: $('f-bio').value.trim() || null, social_url: social || null, avatar_url: avatar || null
            });
            btn.disabled = false;
            if (ins.error) {
                say($('apply-msg'), /duplicate|one_pending/i.test(ins.error.message) ? 'عندك طلب قيد المراجعة بالفعل.' : 'ما قدرنا نرسل الطلب: ' + ins.error.message, 'err');
                return;
            }
            say($('apply-msg'), '');
            await render();
        };

        client.auth.onAuthStateChange(function () { /* التحديث يتم عند الأزرار */ });
        render().catch(function (e) { var f = $('fatal'); f.hidden = false; f.textContent = 'تعذّر الاتصال بالخادم: ' + (e && e.message || e); });
    })();
    </script>
    <script src="../data/site.js"></script>
</body>
</html>
