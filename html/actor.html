<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google-site-verification" content="V5K4gME715mhjvvhA7y2I6dHxR_x2pxBjrQPpJE_d04" />
    <meta name="theme-color" content="#111111">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../icon-192.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../css/style.css">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('../sw.js').catch(err => console.log('SW Error:', err));
        });
      }
    </script>
    <title>بورتفوليو المؤدي - Black Echo</title>
    <style>
        :root{
            --he-bg:#07080c; --he-surface:#12141c; --he-surface-2:#181a24; --he-border:#262838;
            --he-red:var(--accent-red, #e50914); --he-red-2:#ff3b3b; --he-gold:#ffb800; --he-muted:#93939f;
        }
        @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }
        body{ font-family:'Cairo', sans-serif; background:var(--he-bg); color:#fff; margin:0; }

        .actor-header{
            position:relative; text-align:center; padding:70px 20px 55px;
            background:linear-gradient(180deg, #14151d 0%, var(--he-bg) 100%);
            border-bottom:1px solid var(--he-border); overflow:hidden; isolation:isolate;
        }
        .actor-header::before{
            content:""; position:absolute; inset:0; z-index:-1;
            background:radial-gradient(ellipse 50% 60% at 50% 0%, rgba(229,9,20,0.25), transparent 70%);
        }
        .actor-logo-img{
            width:118px; height:118px; border-radius:50%; object-fit:cover;
            border:3px solid var(--he-red-2); margin:0 auto 18px auto; display:none;
            box-shadow:0 10px 30px -6px rgba(229, 9, 20, 0.5);
        }
        .actor-avatar-fallback{
            width:118px; height:118px; border-radius:50%; margin:0 auto 18px; display:flex; align-items:center; justify-content:center;
            background:linear-gradient(135deg, var(--he-surface-2), var(--he-border)); color:var(--he-muted); font-size:2.4rem;
            border:3px solid var(--he-border);
        }
        .actor-header h1{ margin:0 0 8px 0; font-size:clamp(1.8rem,4vw,2.4rem); font-weight:900; color:#fff; }
        .actor-header p{ margin:0; color:var(--he-red-2); font-size:1rem; font-weight:700; }

        .container{ max-width:1200px; margin:0 auto; padding:0 20px 70px; }
        .section-title{ font-size:1.3rem; font-weight:900; margin:50px 0 26px; text-align:center; color:#eee; }
        .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:20px; }

        .role-card{
            background:var(--he-surface); border-radius:14px; overflow:hidden; border:1px solid var(--he-border);
            transition:0.3s; cursor:pointer; opacity:0; transform:translateY(18px); animation:heFadeIn .6s ease forwards;
        }
        @keyframes heFadeIn{ to{ opacity:1; transform:translateY(0); } }
        .role-card:hover{ border-color:var(--he-red-2); transform:translateY(-7px); box-shadow:0 16px 30px -12px rgba(229, 9, 20, 0.25); }
        .role-card .img-wrap{ width:100%; aspect-ratio:3/4; overflow:hidden; }
        .role-card img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s ease; }
        .role-card:hover img{ transform:scale(1.08); }
        .role-info{ padding:14px; text-align:center; }
        .role-info h3{ margin:0 0 5px 0; font-size:1rem; color:#fff; }
        .role-info span{ color:var(--he-muted); font-size:0.85rem; }

        .empty-note{ text-align:center; color:var(--he-muted); grid-column:1/-1; padding:30px; border:1px dashed var(--he-border); border-radius:12px; }

        footer{ text-align:center; padding:34px 20px; color:var(--he-muted); font-size:0.85rem; border-top:1px solid var(--he-border); }
        footer a{ color:var(--he-muted); text-decoration:none; }
        footer a:hover{ color:var(--he-red-2); }
    </style>
</head>
<body>
   <header class="main-header">
        <div class="logo">
            <div class="logo rgb-text">AR Anime</div>    
        </div>
        <div class="menu-icon">☰</div>
        <nav id="navMenu">
            <div class="close-btn">&times;</div>
            <a href="../index.html"><span class="rgb-text">الرئيسية</span></a>
            <a href="browse.html"><span class="rgb-text">الدوبلاج</span></a>
            <a href="women.html"><span class="rgb-text">الفتيات</span></a>
            <a href="men.html"><span class="rgb-text">الشباب</span></a>
            <a href="competition.html"><span class="rgb-text">المسابقات</span></a>
            <a href="teams.html"><span class="rgb-text">قائمة المدبلجين</span></a>
        </nav>
    </header>
    <div class="actor-header">
        <img id="actor-logo-img" src="" alt="Actor Logo" class="actor-logo-img">
        <h1 id="actor-name">جاري التحميل...</h1>
        <p id="actor-role">بورتفوليو الأعمال والشخصيات</p>
    </div>

    <div class="container">
        <h2 class="section-title">الأدوار التي قام بتأديتها</h2>
        <div id="roles-grid" class="grid"></div>
    </div>

    <footer>
        <a href="legal.html">سياسة الخصوصية</a> | <a href="tel:+905014770828">تواصل معنا</a>
        <p>&copy; 2026 أكاديمية Black Echo.</p>
    </footer>

    <script src="../data/dubbers_data.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const menuIcon = document.querySelector('.menu-icon');
            const navMenu = document.getElementById('navMenu');
            const closeBtn = document.querySelector('.close-btn');
            if(menuIcon && navMenu) menuIcon.addEventListener('click', () => navMenu.classList.add('active'));
            if(closeBtn && navMenu) closeBtn.addEventListener('click', () => navMenu.classList.remove('active'));

            const urlParams = new URLSearchParams(window.location.search);
            const actorId = urlParams.get("id");

            const rolesGrid = document.getElementById("roles-grid");

            if (!actorId || typeof dubbersDatabase === 'undefined' || !dubbersDatabase[actorId]) {
                document.getElementById("actor-name").innerText = "لا يوجد بيانات لهذا المؤدي";
                rolesGrid.innerHTML = "<p class='empty-note'>تأكد من صحة الرابط أو اسم المؤدي.</p>";
                return;
            }

            const actorData = dubbersDatabase[actorId];

            document.getElementById("actor-name").innerText = actorData.name;
            if (actorData.role) {
                document.getElementById("actor-role").innerText = actorData.role;
            }

            const logoImg = document.getElementById("actor-logo-img");
            if (actorData.logo) {
                logoImg.src = actorData.logo;
                logoImg.style.display = "block";
            } else {
                const fallback = document.createElement("div");
                fallback.className = "actor-avatar-fallback";
                fallback.innerHTML = `<i class="fa-solid fa-user"></i>`;
                logoImg.replaceWith(fallback);
            }

            const roles = (actorData.roles || []).filter(r => r.charName && r.animeTitle);
            if (roles.length === 0) {
                rolesGrid.innerHTML = "<p class='empty-note'>لا توجد أدوار مسجلة بعد.</p>";
                return;
            }

            roles.forEach((role, i) => {
                const card = document.createElement("div");
                card.className = "role-card";
                card.style.animationDelay = `${i * 60}ms`;
                card.innerHTML = `
                    <div class="img-wrap"><img src="${role.charImage}" alt="${role.charName}"></div>
                    <div class="role-info">
                        <h3>الشخصية: ${role.charName}</h3>
                        <span>الأنمي: ${role.animeTitle}</span>
                    </div>
                `;
                card.onclick = () => {
                    window.location.href = `anime.html?id=${encodeURIComponent(role.animeId)}`;
                };
                rolesGrid.appendChild(card);
            });
        });
    </script>
</body>
</html>
