<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google-site-verification" content="V5K4gME715mhjvvhA7y2I6dHxR_x2pxBjrQPpJE_d04" />
    <meta name="theme-color" content="#111111">
    <meta name="description" id="actor-meta-description" content="بورتفوليو مؤدي أصوات عربي وشخصياته في Black Echo">
    <link rel="canonical" id="actor-canonical" href="">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../icon-192.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../css/style.css">
    <title>بورتفوليو المؤدي - Black Echo</title>
    <style>
        :root{
            --he-bg:#07080c; --he-surface:#12141c; --he-surface-2:#181a24; --he-border:#262838;
            --he-red:#e50914; --he-red-2:#ff3b3b; --he-gold:#ffb800; --he-muted:#93939f;
        }
        @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }
        body{ font-family:'Cairo', sans-serif; background:var(--he-bg); color:#fff; margin:0; }

        .actor-header{
            position:relative; text-align:center; padding:70px 20px 55px;
            background:linear-gradient(180deg, #14151d 0%, var(--he-bg) 100%);
            border-bottom:1px solid var(--he-border); overflow:hidden; isolation:isolate;
        }
        .actor-header::before{
            content:""; position:absolute; inset:0; z-index:-1;
            background:radial-gradient(ellipse 50% 60% at 50% 0%, rgba(229,9,20,0.25), transparent 70%);
        }
        .actor-logo-img{
            width:118px; height:118px; border-radius:50%; object-fit:cover;
            border:3px solid var(--he-red-2); margin:0 auto 18px auto; display:none;
            box-shadow:0 10px 30px -6px rgba(229, 9, 20, 0.5);
        }
        .actor-avatar-fallback{
            width:118px; height:118px; border-radius:50%; margin:0 auto 18px; display:flex; align-items:center; justify-content:center;
            background:linear-gradient(135deg, var(--he-surface-2), var(--he-border)); color:var(--he-muted); font-size:2.4rem;
            border:3px solid var(--he-border);
        }
        .actor-header h1{ margin:0 0 8px 0; font-size:clamp(1.8rem,4vw,2.4rem); font-weight:900; color:#fff; }
        .actor-header p{ margin:0; color:var(--he-red-2); font-size:1rem; font-weight:700; }
        .actor-description{ max-width:720px; margin:16px auto 0 !important; color:#c9c9d1 !important; line-height:1.9; font-size:.92rem !important; font-weight:400 !important; }
        .actor-tier{ display:inline-flex; align-items:center; gap:8px; margin-top:14px; padding:7px 13px; border:1px solid rgba(255,184,0,.35); border-radius:999px; color:var(--he-gold); background:rgba(255,184,0,.08); font-size:.78rem; font-weight:800; }
        .actor-actions{ display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin-top:22px; }
        .actor-action{ display:inline-flex; align-items:center; gap:8px; border:1px solid var(--he-border); border-radius:10px; padding:10px 14px; color:#fff; background:rgba(255,255,255,.06); cursor:pointer; text-decoration:none; font:inherit; font-size:.8rem; font-weight:800; transition:transform .2s ease,border-color .2s ease,background .2s ease; }
        .actor-action:hover{ transform:translateY(-2px); border-color:var(--he-red-2); background:rgba(229,9,20,.2); }
        .actor-action.primary{ background:linear-gradient(135deg,var(--he-red-2),var(--he-red)); border-color:transparent; }
        .social-links{ display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin-top:16px; }
        .social-links:empty{ display:none; }
        .social-link{ display:inline-flex; align-items:center; gap:7px; color:#ddd; text-decoration:none; border:1px solid var(--he-border); border-radius:999px; padding:7px 11px; font-size:.75rem; background:rgba(255,255,255,.04); }
        .social-link:hover{ color:#fff; border-color:var(--he-red-2); }
        .profile-facts{ display:flex; justify-content:center; flex-wrap:wrap; gap:7px; max-width:800px; margin:15px auto 0; }
        .profile-fact{ display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border:1px solid var(--he-border); border-radius:999px; color:#ddd; background:rgba(255,255,255,.04); font-size:.72rem; }
        .portfolio-overview{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:34px 0 10px; }
        .overview-card{ padding:18px 14px; text-align:center; background:linear-gradient(145deg,var(--he-surface),var(--he-surface-2)); border:1px solid var(--he-border); border-radius:14px; }
        .overview-card strong{ display:block; color:var(--he-gold); font-size:1.55rem; line-height:1.2; }
        .overview-card span{ color:var(--he-muted); font-size:.75rem; }
        .section-heading{ display:flex; align-items:end; justify-content:space-between; gap:12px; margin:50px 0 20px; }
        .section-heading .section-title{ margin:0; text-align:right; }
        .role-search{ width:min(280px,100%); padding:10px 13px; border:1px solid var(--he-border); border-radius:10px; outline:none; color:#fff; background:var(--he-surface); font:inherit; font-size:.78rem; }
        .role-search:focus{ border-color:var(--he-red-2); }
        .work-card{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:15px 16px; border:1px solid var(--he-border); border-radius:13px; background:linear-gradient(145deg,var(--he-surface),var(--he-surface-2)); text-decoration:none; color:#fff; transition:.2s ease; }
        .work-card:hover{ transform:translateY(-3px); border-color:var(--he-red-2); }
        .work-card h3{ margin:0 0 4px; font-size:.92rem; }
        .work-card span{ color:var(--he-muted); font-size:.75rem; }
        .work-card i{ color:var(--he-red-2); }
        @media(max-width:620px){ .portfolio-overview{ gap:8px; } .overview-card{ padding:14px 8px; } .overview-card strong{ font-size:1.25rem; } .section-heading{ display:block; } .role-search{ margin-top:14px; width:100%; } }

        .container{ max-width:1200px; margin:0 auto; padding:0 20px 70px; }
        .section-title{ font-size:1.3rem; font-weight:900; margin:50px 0 26px; text-align:center; color:#eee; }
        .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:20px; }

        .role-card{
            background:var(--he-surface); border-radius:14px; overflow:hidden; border:1px solid var(--he-border);
            transition:0.3s; cursor:pointer; opacity:0; transform:translateY(18px); animation:heFadeIn .6s ease forwards;
        }
        @keyframes heFadeIn{ to{ opacity:1; transform:translateY(0); } }
        .role-card:hover{ border-color:var(--he-red-2); transform:translateY(-7px); box-shadow:0 16px 30px -12px rgba(229, 9, 20, 0.25); }
        .role-card .img-wrap{ width:100%; aspect-ratio:3/4; overflow:hidden; }
        .role-card img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s ease; }
        .role-card:hover img{ transform:scale(1.08); }
        .role-info{ padding:14px; text-align:center; }
        .role-info h3{ margin:0 0 5px 0; font-size:1rem; color:#fff; }
        .role-info span{ color:var(--he-muted); font-size:0.85rem; }

        .empty-note{ text-align:center; color:var(--he-muted); grid-column:1/-1; padding:30px; border:1px dashed var(--he-border); border-radius:12px; }

        footer{ text-align:center; padding:34px 20px; color:var(--he-muted); font-size:0.85rem; border-top:1px solid var(--he-border); }
        footer a{ color:var(--he-muted); text-decoration:none; }
        footer a:hover{ color:var(--he-red-2); }
    </style>
    <link rel="stylesheet" href="../css/finish.css">
</head>
<body>
   <header class="main-header">
        <div class="logo">
            <div class="logo rgb-text">AR Anime</div>    
        </div>
        <button type="button" class="menu-icon" aria-label="فتح القائمة" aria-controls="navMenu" aria-expanded="false"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
        <nav id="navMenu">
            <div class="close-btn">&times;</div>
            <a href="../index.html"><span class="rgb-text">الرئيسية</span></a>
            <a href="browse.html"><span class="rgb-text">الدوبلاج</span></a>
            <a href="women.html"><span class="rgb-text">الفتيات</span></a>
            <a href="men.html"><span class="rgb-text">الشباب</span></a>
            <a href="competition.html"><span class="rgb-text">المسابقات</span></a>
            <a href="teams.html"><span class="rgb-text">قائمة المدبلجين</span></a>
        </nav>
    </header>
    <div class="actor-header">
        <img loading="lazy" id="actor-logo-img" src="" alt="Actor Logo" class="actor-logo-img">
        <h1 id="actor-name">جاري التحميل...</h1>
        <p id="actor-role">بورتفوليو الأعمال والشخصيات</p>
        <div id="actor-tier" class="actor-tier" hidden></div>
        <p id="actor-description" class="actor-description"></p>
        <p id="actor-stats" style="margin-top:12px; color:var(--he-muted); font-size:0.9rem;"></p>
        <div id="actor-actions" class="actor-actions"></div>
        <div id="social-links" class="social-links" aria-label="روابط التواصل"></div>
        <div id="profile-facts" class="profile-facts" aria-label="مهارات ومعلومات المدبلج"></div>
    </div>

    <div class="container">
        <div class="portfolio-overview" id="portfolio-overview"></div>
        <div class="section-heading"><h2 class="section-title">الأعمال التي شارك فيها</h2></div>
        <div id="works-grid" class="grid"></div>
        <div class="section-heading"><h2 class="section-title">الشخصيات والأدوار</h2><input id="role-search" class="role-search" type="search" placeholder="ابحث عن شخصية أو عمل..." autocomplete="off"></div>
        <div id="roles-grid" class="grid"></div>
    </div>

    <footer>
        <a href="legal.html">سياسة الخصوصية</a> | <a href="tel:+905014770828">تواصل معنا</a>
        <p>&copy; 2026 أكاديمية Black Echo.</p>
    </footer>

    <script src="../data/anime_db.js"></script>
    <script src="../data/catalog_data.js"></script>
    <script src="../data/dubbers_data.js"></script>
    <script src="../data/actors_engine.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const urlParams = new URLSearchParams(window.location.search);
            const actorId = urlParams.get("id");
            const cleanShareUrl = actorId ? `${window.location.origin}${window.location.pathname}?id=${encodeURIComponent(actorId)}` : `${window.location.origin}${window.location.pathname}`;
            const canonical = document.getElementById('actor-canonical');
            if (canonical) canonical.href = cleanShareUrl;

            const rolesGrid = document.getElementById("roles-grid");
            const worksGrid = document.getElementById("works-grid");

            if (!actorId || typeof dubbersDatabase === 'undefined' || !dubbersDatabase[actorId]) {
                document.getElementById("actor-name").innerText = "لا يوجد بيانات لهذا المؤدي";
                rolesGrid.innerHTML = "<p class='empty-note'>تأكد من صحة الرابط أو اسم المؤدي.</p>";
                return;
            }

            const actorData = dubbersDatabase[actorId];
            const profile = (window.ActorsEngine && window.ActorsEngine.getActorProfile(actorId)) || { name: actorData.name || actorId, role: actorData.role || 'مؤدي أصوات', description: 'صوت شغوف يضيف احتراماً وصدقاً لكل شخصية يؤديها.', tier: 'متوسط' };

            document.getElementById("actor-name").innerText = profile.name;
            document.title = `${profile.name} | مدبلج عربي | Black Echo`;
            const metaDescription = document.getElementById('actor-meta-description');
            if (metaDescription) metaDescription.content = `${profile.description} استعرض شخصيات ${profile.name} وأعماله في Black Echo.`;
            const description = document.getElementById('actor-description');
            if (description) description.innerText = profile.description;
            const tier = document.getElementById('actor-tier');
            if (tier) { tier.hidden = false; tier.innerHTML = `<i class="fa-solid fa-award"></i> مستوى العرض: ${profile.tier}`; }
            if (profile.role) {
                document.getElementById("actor-role").innerText = profile.role;
            }

            const logoImg = document.getElementById("actor-logo-img");
            if (actorData.logo) {
                logoImg.src = actorData.logo;
                logoImg.style.display = "block";
            } else {
                const fallback = document.createElement("div");
                fallback.className = "actor-avatar-fallback";
                fallback.innerHTML = `<i class="fa-solid fa-user"></i>`;
                logoImg.replaceWith(fallback);
            }

            // الأدوار هنا = roles[] اليدوية (لو موجودة) + أي أدوار جديدة اتضافت في dubbedCharacters
            // داخل anime_db.js واتربطت تلقائياً بهذا المؤدي — بدون أي تكرار
            const aggregate = (typeof window.ActorsEngine !== "undefined")
                ? window.ActorsEngine.getActorAggregate(actorId)
                : { roles: (actorData.roles || []).filter(r => r.charName && r.animeTitle) };

            const statsEl = document.getElementById("actor-stats");
            if (statsEl && typeof aggregate.workCount !== "undefined") {
                statsEl.innerText = `${aggregate.workCount} عمل • ${aggregate.characterCount} شخصية`;
            }

            const roles = aggregate.roles;
            const workMap = new Map();
            roles.forEach((role) => {
                const key = role.animeId || role.animeTitle;
                if (!workMap.has(key)) workMap.set(key, { id: role.animeId, title: role.animeTitle, roles: [] });
                workMap.get(key).roles.push(role.charName);
            });
            const works = [...workMap.values()];
            const overview = document.getElementById('portfolio-overview');
            if (overview) overview.innerHTML = `<div class="overview-card"><strong>${works.length}</strong><span>أعمال</span></div><div class="overview-card"><strong>${roles.length}</strong><span>شخصية</span></div><div class="overview-card"><strong>${profile.tier}</strong><span>مستوى العرض</span></div>`;
            const actionBox = document.getElementById('actor-actions');
            if (actionBox) actionBox.innerHTML = `<button type="button" class="actor-action primary" id="share-actor"><i class="fa-solid fa-share-nodes"></i> شارك الصفحة</button><button type="button" class="actor-action" id="follow-actor"><i class="fa-solid fa-bell"></i> متابعة محلية</button><button type="button" class="actor-action" id="print-actor"><i class="fa-solid fa-print"></i> طباعة البطاقة</button><a class="actor-action" href="../index.html#contact"><i class="fa-solid fa-envelope"></i> تواصل مع Black Echo</a>`;
            const socialBox = document.getElementById('social-links');
            const socials = actorData.socials || actorData.socialLinks || {};
            const socialMeta = { youtube:['fa-brands fa-youtube','YouTube'], instagram:['fa-brands fa-instagram','Instagram'], tiktok:['fa-brands fa-tiktok','TikTok'], telegram:['fa-brands fa-telegram','Telegram'], discord:['fa-brands fa-discord','Discord'], x:['fa-brands fa-x-twitter','X'] };
            if (socialBox) Object.entries(socials).forEach(([key, url]) => { if (!url || !socialMeta[key]) return; const safeUrl = String(url); if (!/^https?:\/\//i.test(safeUrl)) return; socialBox.insertAdjacentHTML('beforeend', `<a class="social-link" href="${safeUrl}" target="_blank" rel="noopener noreferrer"><i class="${socialMeta[key][0]}"></i> ${socialMeta[key][1]}</a>`); });
            if (socialBox && !socialBox.children.length) socialBox.innerHTML = '<span class="social-link" style="cursor:default;color:var(--he-muted);"><i class="fa-solid fa-link-slash"></i> لم تتم إضافة روابط التواصل بعد</span>';
            const factsBox = document.getElementById('profile-facts'); const facts = []; const addFacts = (value, icon, prefix='') => { (Array.isArray(value) ? value : value ? [value] : []).filter(Boolean).forEach(item => facts.push(`<span class="profile-fact"><i class="${icon}"></i> ${prefix}${item}</span>`)); }; addFacts(actorData.skills, 'fa-solid fa-wand-magic-sparkles'); addFacts(actorData.dialects, 'fa-solid fa-language'); addFacts(actorData.availability, 'fa-solid fa-circle-check'); addFacts(actorData.sampleLinks, 'fa-solid fa-headphones', 'عينة صوتية: '); if (factsBox) factsBox.innerHTML = facts.join('');
            document.getElementById('share-actor')?.addEventListener('click', async () => { const shareData = { title: `${profile.name} | Black Echo`, text: `شاهد بورتفوليو ${profile.name} على Black Echo`, url: cleanShareUrl }; try { if (navigator.share) await navigator.share(shareData); else { await navigator.clipboard.writeText(cleanShareUrl); alert('تم نسخ رابط المشاركة النظيف'); } } catch (_) {} });
            const followedKey = 'be-followed-actors'; const followed = (() => { try { return JSON.parse(localStorage.getItem(followedKey) || '[]'); } catch (_) { return []; } })(); const followButton = document.getElementById('follow-actor'); if (followButton) { const syncFollow = () => { const active = followed.includes(actorId); followButton.innerHTML = active ? '<i class="fa-solid fa-bell-slash"></i> إلغاء المتابعة' : '<i class="fa-solid fa-bell"></i> متابعة محلية'; }; syncFollow(); followButton.onclick = () => { const index = followed.indexOf(actorId); if (index >= 0) followed.splice(index, 1); else followed.push(actorId); localStorage.setItem(followedKey, JSON.stringify(followed)); syncFollow(); }; }
            document.getElementById('print-actor')?.addEventListener('click', () => window.print());
            const titleFor = (id, fallback) => { const item = typeof animeCatalog !== 'undefined' && animeCatalog.find((entry) => entry.id === id); return item?.title || fallback || id; };
            works.forEach((work) => { work.title = titleFor(work.id, work.title); });
            if (worksGrid) worksGrid.innerHTML = works.length ? works.map((work) => `<a class="work-card" href="anime.html?id=${encodeURIComponent(work.id || work.title)}"><div><h3>${work.title}</h3><span>${work.roles.length} شخصية مرتبطة بهذا العمل</span></div><i class="fa-solid fa-arrow-left"></i></a>`).join('') : '<p class="empty-note">لا توجد أعمال مسجلة بعد.</p>';
            const renderRoles = (term = '') => { const query = term.trim().toLocaleLowerCase('ar'); rolesGrid.querySelectorAll('.role-card').forEach(card => { card.hidden = query && !card.textContent.toLocaleLowerCase('ar').includes(query); }); };
            document.getElementById('role-search')?.addEventListener('input', (event) => renderRoles(event.target.value));
            if (!roles || roles.length === 0) {
                rolesGrid.innerHTML = "<p class='empty-note'>لا توجد أدوار مسجلة بعد.</p>";
                return;
            }

            function imgWrapHtml(role) {
                return role.charImage
                    ? `<div class="img-wrap"><img loading="lazy" src="${role.charImage}" alt="${role.charName}"></div>`
                    : `<div class="img-wrap" style="display:flex;align-items:center;justify-content:center;background:var(--he-surface-2,#181a24);"><i class="fa-solid fa-masks-theater" style="font-size:2rem;color:var(--he-muted,#93939f);"></i></div>`;
            }

            roles.forEach((role, i) => {
                const card = document.createElement("div");
                card.className = "role-card";
                card.dataset.roleIndex = i;
                card.style.animationDelay = `${i * 60}ms`;
                card.innerHTML = `
                    ${imgWrapHtml(role)}
                    <div class="role-info">
                        <h3>الشخصية: ${role.charName}</h3>
                        <span>الأنمي: ${role.animeTitle}</span>
                    </div>
                `;
                if (role.animeId) {
                    card.onclick = () => {
                        window.location.href = `anime.html?id=${encodeURIComponent(role.animeId)}`;
                    };
                } else {
                    card.classList.add('is-static-role');
                }
                rolesGrid.appendChild(card);
            });

            // بتجيب صور الشخصيات من MyAnimeList (Jikan API) للأدوار اللي مالهاش
            // صورة يدوية، وبتحدّث الكارت في الصفحة فور ما الصورة توصل (بدون إعادة تحميل)
            if (typeof window.ActorsEngine !== "undefined" && window.ActorsEngine.hydrateRoleImages) {
                window.ActorsEngine.hydrateRoleImages(roles, (role, i) => {
                    const card = rolesGrid.querySelector(`[data-role-index="${i}"]`);
                    if (!card) return;
                    const wrap = card.querySelector(".img-wrap");
                    if (wrap) wrap.outerHTML = imgWrapHtml(role);
                });
            }
        });
    </script>
    <script src="../data/site.js"></script>
</body>
</html>
