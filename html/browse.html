    <style>
        :root{
            --he-bg:#07080c; --he-surface:#12141c; --he-surface-2:#181a24; --he-border:#262838;
            --he-red:#e50914; --he-red-2:#ff3b3b; --he-gold:#ffb800;
            --he-blue:#3d7bff; --he-pink:#ff4fa0; --he-text:#f2f2f5; --he-muted:#93939f;
        }
        @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; scroll-behavior:auto !important; } }
        html{ scroll-behavior:smooth; }
        body{ background:var(--he-bg); }
 
        .he-section{ max-width:1240px; margin:0 auto; padding:10px 20px 70px; }
        .he-section-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:28px; flex-wrap:wrap; }
        .he-eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:0.78rem; font-weight:700; letter-spacing:0.5px; color:var(--he-red-2); text-transform:uppercase; margin-bottom:8px; font-family:'Cairo',sans-serif; }
        .he-eyebrow::before{ content:""; width:18px; height:2px; background:var(--he-red-2); display:inline-block; }
        .he-title-lg{ font-family:'Cairo',sans-serif; font-weight:900; font-size:clamp(1.5rem, 3vw, 2.2rem); color:#fff; margin:0; }
        .he-sub{ color:var(--he-muted); font-size:0.92rem; margin-top:6px; }
        .he-reveal{ opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s ease; }
        .he-reveal.is-visible{ opacity:1; transform:translateY(0); }
        footer{ text-align:center; padding:34px 20px; color:var(--he-muted); font-size:0.85rem; border-top:1px solid var(--he-border); margin-top:20px; font-family:'Cairo',sans-serif; }
        footer a{ color:var(--he-muted); text-decoration:none; }
        footer a:hover{ color:var(--he-red-2); }
 
        /* بحث */
        .search-container{ position:relative; }
        #search-input{
            background:rgba(255,255,255,0.05);
            border:1px solid var(--he-border);
            color:#fff;
            padding:10px 16px;
            border-radius:10px;
            font-family:'Cairo',sans-serif;
            font-size:0.9rem;
            width:220px;
            transition:border-color .25s ease, background .25s ease, width .25s ease;
        }
        #search-input:focus{ outline:none; border-color:var(--he-red-2); background:rgba(255,255,255,0.08); width:260px; }
        .search-dropdown{
            position:absolute; top:calc(100% + 10px); left:0; width:280px; max-height:360px; overflow-y:auto;
            background:var(--he-surface); border:1px solid var(--he-border); border-radius:12px; z-index:50;
            box-shadow:0 20px 40px -12px rgba(0,0,0,0.6); display:none;
        }
        .search-item{ display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:pointer; transition:background .2s ease; border-bottom:1px solid var(--he-border); }
        .search-item:last-child{ border-bottom:none; }
        .search-item:hover{ background:rgba(229,9,20,0.1); }
        .search-item img{ width:38px; height:52px; object-fit:cover; border-radius:5px; }
        .search-item span{ font-size:0.85rem; color:#fff; }
 
        /* هيرو متعدد */
        .full-width-hero{ width:100%; height:480px; position:relative; overflow:hidden; margin-bottom:36px; background-color:#0e1016; border-radius:0 0 22px 22px; }
        .hero-slide{ position:absolute; top:0; left:0; width:100%; height:100%; background-size:cover; background-position:center; opacity:0; visibility:hidden; transition:opacity 0.8s ease-in-out, visibility 0.8s ease-in-out; display:flex; align-items:flex-end; padding:50px 8%; box-sizing:border-box; cursor:pointer; }
        .hero-slide.active{ opacity:1; visibility:visible; }
        .hero-overlay{ position:absolute; top:0; left:0; width:100%; height:100%; background:linear-gradient(to top, #07080c 8%, rgba(7,8,12,0.35) 50%, rgba(7,8,12,0.75) 100%); z-index:1; }
        .hero-content{ position:relative; z-index:2; max-width:650px; text-align:right; }
        .hero-content h1{ font-size:2.6rem; font-weight:900; color:#fff; margin-bottom:12px; text-shadow:2px 2px 8px rgba(0,0,0,0.9); line-height:1.3; font-family:'Cairo',sans-serif; }
        .hero-meta{ display:flex; gap:15px; align-items:center; margin-bottom:18px; font-size:14px; }
        .hero-meta .rating{ color:var(--he-gold); font-weight:bold; }
        .hero-meta .badge{ background:var(--he-red-2); color:white; padding:3px 10px; border-radius:5px; font-size:11px; font-weight:bold; }
        .hero-meta .type{ color:#b2bec3; }
        .hero-btn{ background:linear-gradient(135deg, var(--he-red-2), var(--he-red)); color:white; border:none; padding:13px 32px; font-size:15px; font-weight:bold; border-radius:8px; cursor:pointer; transition:0.3s; box-shadow:0 10px 26px -8px rgba(229, 56, 56, 0.5); font-family:'Cairo',sans-serif; }
        .hero-btn:hover{ transform:translateY(-3px) scale(1.02); box-shadow:0 16px 30px -8px rgba(229, 56, 56, 0.7); }
        @media (max-width: 768px){ .full-width-hero{ height:340px; } .hero-content h1{ font-size:1.7rem; } .hero-slide{ padding:30px 5%; } }
 
        /* شبكة الأنميات */
        .anime-grid.video-grid{
            display:grid !important;
            grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)) !important;
            gap:20px !important;
        }
        .anime-grid .anime-card{
            border-radius:14px;
            transition:transform .35s ease;
        }
        .anime-grid .anime-card:hover{ transform:translateY(-8px); }
        .anime-grid .anime-card-image{ box-shadow:0 4px 18px rgba(0,0,0,0.35); }
 
        /* شاشة التحميل */
        #loader-wrapper{
            position:fixed; inset:0; z-index:999;
            background:var(--he-bg);
            display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
        }
        .spinner{
            width:52px; height:52px; border-radius:50%;
            border:3px solid var(--he-border);
            border-top-color:var(--he-red-2);
            animation:heSpin 0.9s linear infinite;
        }
        @keyframes heSpin{ to{ transform:rotate(360deg); } }
        #loader-wrapper p{ color:var(--he-muted); font-family:'Cairo',sans-serif; font-size:0.9rem; }
 
        /* نافذة الفيديو */
        .modal{ position:fixed; inset:0; background:rgba(5,5,8,0.9); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:200; padding:20px; }
        .video-modal-content{ position:relative; width:100%; max-width:900px; background:var(--he-surface); border:1px solid var(--he-border); border-radius:16px; padding:16px; }
        .close-video{ position:absolute; top:-14px; left:-14px; background:var(--he-red-2); color:#fff; border:none; width:36px; height:36px; border-radius:50%; cursor:pointer; font-weight:bold; z-index:5; box-shadow:0 6px 16px rgba(0,0,0,0.5); }
        .video-wrapper{ position:relative; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:10px; }
        .video-wrapper iframe{ position:absolute; top:0; left:0; width:100%; height:100%; border:none; }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
 
            const revealEls = document.querySelectorAll('.he-reveal');
            if ('IntersectionObserver' in window) {
                const io = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) { entry.target.classList.add('is-visible'); io.unobserve(entry.target); }
                    });
                }, { threshold: 0.08 });
                revealEls.forEach(el => io.observe(el));
            } else {
                revealEls.forEach(el => el.classList.add('is-visible'));
            }

            let activeFilter = 'all';
            let activeAccessFilter = 'all';
            const isDirectVideoUrl = (url) => /\.(mp4|webm|ogg)(?:[?#]|$)/i.test(String(url || '')) || /archive\.org\/download\//i.test(String(url || ''));
            const getAnimeAccess = (id) => {
                const anime = typeof animeDetailsDatabase !== 'undefined' ? animeDetailsDatabase[id] : null;
                if (!anime) return 'ads';
                const seasons = Array.isArray(anime.seasons) && anime.seasons.length ? anime.seasons : [{ episodes: anime.episodes || [] }];
                const servers = seasons.flatMap((season) => (season.episodes || []).flatMap((episode) => episode.servers || []));
                return servers.some((server) => Boolean(server.direct_url) || isDirectVideoUrl(server.url)) ? 'free' : 'ads';
            };
            const applyBrowseFilters = () => {
                const query = (document.getElementById('browse-filter-input')?.value || '').trim().toLocaleLowerCase('ar');
                document.querySelectorAll('#recent-releases-grid .anime-card').forEach((card) => {
                    const text = card.textContent.toLocaleLowerCase('ar');
                    const matchesFilter = activeFilter === 'all' || text.includes(activeFilter.toLocaleLowerCase('ar'));
                    const matchesAccess = activeAccessFilter === 'all' || getAnimeAccess(card.dataset.animeId) === activeAccessFilter;
                    card.hidden = !(matchesFilter && matchesAccess && (!query || text.includes(query)));
                });
            };
            document.querySelectorAll('.be-filter-chip').forEach((button) => button.addEventListener('click', () => {
                if (button.dataset.accessFilter) {
                    activeAccessFilter = button.dataset.accessFilter;
                    activeFilter = 'all';
                } else {
                    activeFilter = button.dataset.filter || 'all';
                    if (activeFilter === 'all') activeAccessFilter = 'all';
                }
                document.querySelectorAll('.be-filter-chip').forEach((item) => item.classList.toggle('is-active', item === button));
                applyBrowseFilters();
            }));
            document.getElementById('browse-filter-input')?.addEventListener('input', applyBrowseFilters);
            const filterObserver = new MutationObserver(applyBrowseFilters);
            const releases = document.getElementById('recent-releases-grid');
            if (releases) filterObserver.observe(releases, { childList: true });
        });
    </script>
